<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>И16 · Вход по email</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/workspace.js" defer></script>
  <script src="/help.js" defer></script>
</head>
<body class="has-executive">
  <header class="hero">
    <div class="wrap">
      <div class="hero-nav">
        <p class="kicker">И16</p>
        <div class="hero-actions">
          <button type="button" class="help-open" data-help-page="login">Помощник</button>
          <label class="theme-setting" hidden>Тема <select id="theme"></select></label>
        </div>
      </div>
      <h1>Вход по email</h1>
    </div>
  </header>
  <main class="wrap">
    <a href="/">Вернуться к рейтингу</a>
    <section class="workspace-access" aria-labelledby="email-heading">
      <h2 id="email-heading">Рабочая область аналитика</h2>
      <form id="email-form">
        <p>Введите email. Мы пришлём ссылку для регистрации или входа.</p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button type="submit">Получить ссылку</button>
      </form>
      <form id="verify-form" hidden>
        <p>Подтвердите вход, чтобы открыть рабочую область.</p>
        <button type="submit">Подтвердить вход</button>
      </form>
      <p id="workspace-status" role="status"></p>
    </section>
  </main>
</body>
</html>
